server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # Buffer overflow protection
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 1m;
    large_client_header_buffers 2 1k;

    # Timeouts to prevent slowloris attacks
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # Limit connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 10;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
    limit_req zone=req_limit_per_ip burst=20 nodelay;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    gzip_disable "msie6";

    # Enhanced security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com; frame-src 'self' https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    
    # Remove server signature
    more_clear_headers Server;
    more_clear_headers X-Powered-By;

    # Block common exploit attempts
    location ~* (\.php|\.asp|\.aspx|\.jsp|\.cgi|\.pl)$ {
        deny all;
        return 404;
    }

    # Block access to sensitive files
    location ~* (\.git|\.svn|\.env|\.htaccess|\.htpasswd|composer\.json|package\.json|\.sql|\.backup)$ {
        deny all;
        return 404;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block SQL injection attempts
    location ~* (union|select|insert|drop|delete|update|concat|script|alert) {
        deny all;
        return 403;
    }

    # Cache static assets with security headers
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Root location - serve index.html
    location = / {
        try_files /index.html /pages/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Handle page routes
    location ~ ^/(about|careers|contact|resources|services|404)$ {
        try_files /pages/$1.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Handle .html extension requests
    location ~ \.html$ {
        try_files $uri /pages$uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Fallback for other requests
    location / {
        try_files $uri $uri/ $uri.html /pages$uri /pages$uri.html =404;
    }

    # Custom error pages (obfuscated)
    error_page 404 /404.html;
    error_page 403 /404.html;  # Show 404 instead of 403 to obfuscate
    error_page 500 502 503 504 /404.html;  # Hide server errors

    # Security logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}