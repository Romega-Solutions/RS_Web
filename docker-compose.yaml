version: "3.8"

services:
  romega-website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: romega-solutions-website
    ports:
      - "3000:3000"
    restart: unless-stopped
    
    # Security: Read-only root filesystem (excluding Next.js cache)
    read_only: true
    
    # Security: Capability restrictions
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    
    # Security: Run as non-root user
    user: "1001:1001"
    
    # Security: Resource limits (adjusted for Next.js)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Security: Disable new privileges
    security_opt:
      - no-new-privileges:true
    
    # Security: Temporary filesystems for Next.js
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/.next/cache:noexec,nosuid,size=200m
    
    # Health check for Next.js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"] 
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    
    networks:
      - romega-network
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  romega-network:
    driver: bridge
    # Security: Enable network isolation
    internal: false
    driver_opts:
      com.docker.network.bridge.name: romega-br0
      com.docker.network.bridge.enable_ip_masquerade: "true"
