version: "3.8"

services:
  romega-website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: romega-solutions-website
    ports:
      - "3000:3000"
    restart: unless-stopped
    
    # Security: Read-only root filesystem (excluding Next.js cache)
    read_only: true
    
    # Security: Capability restrictions
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    
    # Security: Run as non-root user
    user: "1001:1001"
    
    # Security: Resource limits (adjusted for Next.js)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Security: Disable new privileges
    security_opt:
      - no-new-privileges:true
    
    # Security: Temporary filesystems for Next.js
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/.next/cache:noexec,nosuid,size=200m
    
    # Health check for Next.js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"] 
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    
    # Environment variables
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - ENABLE_METRICS=true
    
    # Docker secrets for sensitive data
    secrets:
      - smtp_password
      - api_keys
      - resend_api_key
    
    networks:
      - romega-network
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
      # NOTE: Also being collected by Promtail for Loki

  # ==============================================================================
  # OBSERVABILITY STACK - Prometheus, Grafana, Loki
  # ==============================================================================

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: romega-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - romega-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"  # nobody user

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: romega-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - romega-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
      - loki

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: romega-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - romega-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Promtail - Log collector for Loki
  promtail:
    image: grafana/promtail:latest
    container_name: romega-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - romega-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - loki

networks:
  romega-network:
    driver: bridge
    # Security: Enable network isolation
    internal: false
    driver_opts:
      com.docker.network.bridge.name: romega-br0
      com.docker.network.bridge.enable_ip_masquerade: "true"

# Docker Secrets for sensitive data
# Create secret files in ./secrets/ directory
secrets:
  smtp_password:
    file: ./secrets/smtp_password.txt
  api_keys:
    file: ./secrets/api_keys.txt
  resend_api_key:
    file: ./secrets/resend_api_key.txt

# Persistent volumes for observability stack
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
