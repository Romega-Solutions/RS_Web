# ==============================================================================
# Promtail Configuration for Romega Solutions Website
# ==============================================================================
# Promtail collects logs and sends them to Loki
# This configuration scrapes Docker container logs

server:
  http_listen_port: 9080
  grpc_listen_port: 0

# Where to send logs
clients:
  - url: http://loki:3100/loki/api/v1/push

# Positions file to track which logs have been sent
positions:
  filename: /tmp/positions.yaml

# Scrape configurations
scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    
    relabel_configs:
      # Only scrape containers with specific labels
      - source_labels: ['__meta_docker_container_name']
        regex: '/(romega-.*)'
        action: keep
      
      # Add container name as label
      - source_labels: ['__meta_docker_container_name']
        target_label: container_name
        regex: '/(.*)'
        replacement: '$1'
      
      # Add container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
        regex: '(.*)'
        replacement: '$1'
      
      # Add image name
      - source_labels: ['__meta_docker_container_image']
        target_label: image
      
      # Set job name from container label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: job
        replacement: '$1'
      
      # Add log path
      - source_labels: ['__meta_docker_container_id']
        target_label: __path__
        replacement: '/var/lib/docker/containers/$1/*.log'

    # Pipeline stages for log processing
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            stream: stream
            log: log
            time: time
      
      # Extract timestamp
      - timestamp:
          source: time
          format: RFC3339Nano
      
      # Set output field
      - output:
          source: log
      
      # Add labels for log level (if present)
      - labels:
          stream:

