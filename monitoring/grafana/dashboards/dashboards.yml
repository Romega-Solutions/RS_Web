# ==============================================================================
# Grafana Dashboards Provisioning
# ==============================================================================
# Automatically loads dashboard JSON files from the dashboards directory

apiVersion: 1

providers:
  - name: 'Romega Solutions Dashboards'
    orgId: 1
    folder: 'Romega Solutions'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
