<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careers - Romega Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <!-- source sans 3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navigation Container -->
    <div id="navbar-container"></div>

    <!-- Careers Page Content -->
    <main class="bg-gray-50 min-h-screen">
      <section class="py-20">
        <div class="max-w-7xl mx-auto px-4">
          <h1
            class="text-4xl md:text-6xl font-bold text-gray-900 mb-6 text-center"
          >
            Join Our Team
          </h1>
          <p class="text-xl text-gray-600 mb-12 text-center max-w-3xl mx-auto">
            Explore exciting career opportunities and become part of our growing
            team.
          </p>

          <!-- Career Opportunities -->
          <div class="space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="text-2xl font-bold mb-2">Position Title 1</h3>
                  <p class="text-gray-600 mb-4">
                    Department • Location • Full-time
                  </p>
                  <p class="text-gray-700">
                    Brief description of the position...
                  </p>
                </div>
                <a
                  href="#"
                  class="bg-blue-500 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-600 transition duration-300"
                >
                  Apply Now
                </a>
              </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="text-2xl font-bold mb-2">Position Title 2</h3>
                  <p class="text-gray-600 mb-4">
                    Department • Location • Full-time
                  </p>
                  <p class="text-gray-700">
                    Brief description of the position...
                  </p>
                </div>
                <a
                  href="#"
                  class="bg-blue-500 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-600 transition duration-300"
                >
                  Apply Now
                </a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="../assets/js/main.js"></script>
  </body>
</html>
