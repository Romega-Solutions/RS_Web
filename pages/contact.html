<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Romega Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <!-- source sans 3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navigation Container -->
    <div id="navbar-container"></div>

    <!-- Contact Page Content -->
    <main class="bg-gray-50 min-h-screen">
      <section class="py-20">
        <div class="max-w-7xl mx-auto px-4">
          <h1
            class="text-4xl md:text-6xl font-bold text-gray-900 mb-6 text-center"
          >
            Contact Us
          </h1>
          <p class="text-xl text-gray-600 mb-12 text-center max-w-3xl mx-auto">
            Get in touch with us. We'd love to hear from you.
          </p>

          <div class="grid md:grid-cols-2 gap-12">
            <!-- Contact Form -->
            <div class="bg-white p-8 rounded-lg shadow-md">
              <h3 class="text-2xl font-bold mb-6">Send us a Message</h3>
              <form id="contact-form">
                <div class="mb-4">
                  <label
                    for="name"
                    class="block text-gray-700 text-sm font-bold mb-2"
                    >Name</label
                  >
                  <input
                    type="text"
                    id="name"
                    name="name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                  />
                </div>
                <div class="mb-4">
                  <label
                    for="email"
                    class="block text-gray-700 text-sm font-bold mb-2"
                    >Email</label
                  >
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                  />
                </div>
                <div class="mb-4">
                  <label
                    for="subject"
                    class="block text-gray-700 text-sm font-bold mb-2"
                    >Subject</label
                  >
                  <input
                    type="text"
                    id="subject"
                    name="subject"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                  />
                </div>
                <div class="mb-6">
                  <label
                    for="message"
                    class="block text-gray-700 text-sm font-bold mb-2"
                    >Message</label
                  >
                  <textarea
                    id="message"
                    name="message"
                    rows="5"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                  ></textarea>
                </div>
                <button
                  type="submit"
                  class="w-full bg-blue-500 text-white px-6 py-3 rounded-md font-semibold hover:bg-blue-600 transition duration-300"
                >
                  Send Message
                </button>
              </form>
            </div>

            <!-- Contact Information -->
            <div class="space-y-8">
              <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-bold mb-4">Office Address</h3>
                <p class="text-gray-600">
                  123 Business Street<br />
                  City, State 12345<br />
                  Country
                </p>
              </div>

              <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-bold mb-4">Contact Information</h3>
                <div class="space-y-2">
                  <p class="text-gray-600">
                    <strong>Phone:</strong> +1 (555) 123-4567
                  </p>
                  <p class="text-gray-600">
                    <strong>Email:</strong> info@romegasolutions.com
                  </p>
                  <p class="text-gray-600">
                    <strong>Hours:</strong> Mon-Fri 9:00 AM - 6:00 PM
                  </p>
                </div>
              </div>

              <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-bold mb-4">Follow Us</h3>
                <div class="flex space-x-4">
                  <a href="#" class="text-blue-500 hover:text-blue-600"
                    >LinkedIn</a
                  >
                  <a href="#" class="text-blue-500 hover:text-blue-600"
                    >Twitter</a
                  >
                  <a href="#" class="text-blue-500 hover:text-blue-600"
                    >Facebook</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="../assets/js/main.js"></script>
  </body>
</html>
