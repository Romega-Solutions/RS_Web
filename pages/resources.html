<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resources - Romega Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <!-- source sans 3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navigation Container -->
    <div id="navbar-container"></div>

    <!-- Resources Page Content -->
    <main class="bg-gray-50 min-h-screen">
      <section class="py-20">
        <div class="max-w-7xl mx-auto px-4">
          <h1
            class="text-4xl md:text-6xl font-bold text-gray-900 mb-6 text-center"
          >
            Resources
          </h1>
          <p class="text-xl text-gray-600 mb-12 text-center max-w-3xl mx-auto">
            Access valuable resources, documentation, and tools to help you
            succeed.
          </p>

          <!-- Resources Grid -->
          <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div
              class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition duration-300"
            >
              <h3 class="text-2xl font-bold mb-4">Documentation</h3>
              <p class="text-gray-600 mb-4">
                Access comprehensive guides and documentation...
              </p>
              <a
                href="#"
                class="text-blue-500 font-semibold hover:text-blue-600"
                >View Docs →</a
              >
            </div>
            <div
              class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition duration-300"
            >
              <h3 class="text-2xl font-bold mb-4">Downloads</h3>
              <p class="text-gray-600 mb-4">
                Download tools, software, and resources...
              </p>
              <a
                href="#"
                class="text-blue-500 font-semibold hover:text-blue-600"
                >Download →</a
              >
            </div>
            <div
              class="bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition duration-300"
            >
              <h3 class="text-2xl font-bold mb-4">Support</h3>
              <p class="text-gray-600 mb-4">
                Get help and support from our team...
              </p>
              <a
                href="#"
                class="text-blue-500 font-semibold hover:text-blue-600"
                >Get Support →</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="../assets/js/main.js"></script>
  </body>
</html>
